[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "revtool"
version = "0.3.0"
description = "Toolkit CLI berbahasa Indonesia untuk recon statis, inspeksi biner, dan reverse engineering CTF (ELF / PE / Mach-O / APK / WASM)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "rev-tools" }
]
keywords = ["reverse-engineering", "binary-analysis", "elf", "pe", "cli", "ctf", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "capstone>=5.0",
    "pyelftools>=0.30",
    "pefile>=2023.2.7",
]

[project.scripts]
revtool = "revtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
